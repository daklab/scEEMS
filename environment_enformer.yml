# Enformer environment for featurization/2_score_enformer.py: the published Enformer model loaded from
# TensorFlow Hub; sequences built with pyfaidx as in the official Enformer usage notebook.
#   conda env create -f environment_enformer.yml
name: scEEMS_enformer
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - setuptools=69.5.1    # tensorflow-hub imports pkg_resources, removed from recent setuptools
  - pip:
    - tensorflow[and-cuda]==2.15.1
    - tensorflow-hub==0.16.1
    - tf-keras==2.15.1
    - pyfaidx==0.8.1.3
    - numpy==1.26.4
    - pandas==2.2.3
    - pyarrow==17.0.0
    - pyyaml==6.0.2
